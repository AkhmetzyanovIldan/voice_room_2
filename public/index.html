<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовой чат</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <!-- Подключаем LiveKit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК КОМНАТЫ -->
    <div id="modal-overlay" class="hidden">
        <div class="modal">
            <h2>Настройки комнаты</h2>
            <div class="range-group">
                <label>Мест за столом (говорящих): <span id="val-seats" class="range-value">6</span></label>
                <input type="range" id="input-max-seats" min="1" max="12" value="6" oninput="document.getElementById('val-seats').innerText = this.value">
            </div>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #ccc;">
                <input type="checkbox" id="input-has-chat" checked style="width: 18px; height: 18px; accent-color: #bb86fc;">
                <label for="input-has-chat">Включить чат в комнате</label>
            </div>
            <button onclick="confirmCreateRoom()">Создать</button>
            <button class="btn-secondary" onclick="document.getElementById('modal-overlay').classList.add('hidden')">Отмена</button>
        </div>
    </div>

    <!-- ЛОББИ -->
    <div id="lobby">
        <h1>Голосовой чат</h1>
        <div id="error-box" class="error"></div>
        <input type="text" id="username-input" placeholder="Ваше имя" maxlength="15">
        
        <div class="section-title">Создать новую комнату:</div>
        <input type="text" id="room-name-input" placeholder="Название комнаты">
        <button onclick="openSettingsModal()">Настроить и создать</button>

        <div class="section-title" style="margin-top: 10px;">Или войти по коду:</div>
        <input type="text" id="room-code-input" placeholder="Код комнаты (например, 4821)">
        <button id="join-btn" class="btn-secondary">Войти в комнату</button>
    </div>

    <!-- КОМНАТА -->
    <div id="room" class="hidden">
        <div class="room-header">
            <div class="room-title-label" id="room-title-display">Название комнаты</div>
            <div class="room-code-label">Код: <span id="room-code-display">----</span></div>
            <div style="display:flex; gap:8px; align-items:center; justify-content:center;">
                <div class="role-indicator" id="role-label">Режим: Наблюдатель</div>
                <div class="role-indicator" id="player-role" style="font-weight:bold;">Вы - —</div>
            </div>
        </div>

        <!-- Игровая панель статусов и кнопки готовности -->
        <div class="game-status-panel">
            <div id="game-status-text">Статус: Ожидание игроков...</div>
            <div id="game-timer-text">--</div>
            <button id="ready-btn-game" onclick="toggleReady()">Готов к игре</button>
        </div>

        <!-- Выпадающая панель списка слушателей -->
        <div id="listeners-panel" class="hidden">
            <h4>Слушатели (<span id="listeners-count-label">0</span>)</h4>
            <div id="listeners-list-content"></div>
        </div>

        <!-- Основная область: Стол и Чат -->
        <div class="room-main-area">
            <div class="table-container" id="table-container">
                <div class="table-center">
                    <span>Стол</span>
                    <span id="users-count">0 участников</span>
                </div>
            </div>

            <div class="chat-container">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Сообщение..." maxlength="150">
                    <button type="button" id="chat-send-btn">➤</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="mic-btn" onclick="toggleMic()" disabled>🎤 Мик</button>
            <button class="ctrl-btn active" id="audio-btn" onclick="toggleAudio()">🔊 Звук</button>
            <button class="ctrl-btn" id="seat-action-btn" onclick="handleSeatAction()">🪑 Сесть</button>
            <button class="ctrl-btn" id="listeners-toggle-btn" onclick="toggleListenersPanel()">👥 Слушатели</button>
            <button class="ctrl-btn danger" onclick="leaveRoom()">🚪 Выйти</button>
        </div>
    </div>

    <script src="/js/livekit.js"></script>
    <script src="/js/socket.js"></script>
    <script src="/js/ui-helpers.js"></script>
    <script src="/js/ui.js"></script>
</body>
</html>
