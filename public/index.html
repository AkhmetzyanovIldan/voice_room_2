<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовой чат</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <!-- Подключаем LiveKit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div id="modal-overlay" class="hidden">
        <div class="modal modal-create hidden" id="create-room-modal">
            <h2>Создать комнату</h2>
            <div class="field-group">
                <label for="create-username-input">Ваше имя</label>
                <input type="text" id="create-username-input" maxlength="15">
            </div>
            <div class="range-group">
                <label>Мест за столом (говорящих): <span id="val-seats" class="range-value">6</span></label>
                <input type="range" id="input-max-seats" min="1" max="12" value="6" oninput="document.getElementById('val-seats').innerText = this.value">
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="input-has-chat" checked>
                <label for="input-has-chat">Включить чат в комнате</label>
            </div>
            <div class="roles-settings">
                <div class="roles-column">
                    <h3>Клан мафии</h3>
                    <div id="mafia-roles"></div>
                </div>
                <div class="roles-column">
                    <h3>Клан мирных</h3>
                    <div id="peaceful-roles"></div>
                </div>
            </div>
            <button onclick="confirmCreateRoom()">Создать</button>
            <button class="btn-secondary" onclick="closeModal()">Отмена</button>
        </div>

        <div class="modal modal-join hidden" id="join-room-modal">
            <h2>Войти в комнату</h2>
            <div class="field-group">
                <label for="join-username-input">Ваше имя</label>
                <input type="text" id="join-username-input" maxlength="15">
            </div>
            <div class="field-group">
                <label for="join-room-code-input">Код комнаты</label>
                <input type="text" id="join-room-code-input" placeholder="Например, 4821" maxlength="6">
            </div>
            <button id="join-btn">Войти</button>
            <button class="btn-secondary" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <!-- ЛОББИ -->
    <div id="lobby">
        <div class="lobby-overlay"></div>
        <div class="lobby-content">
            <h1>МАФИЯ</h1>
            <div id="error-box" class="error"></div>

            <div class="lobby-actions">
                <button id="create-room-btn" class="primary-btn">Создать комнату</button>
                <button id="join-room-btn" class="secondary-btn">Войти в комнату</button>
            </div>
        </div>
    </div>

    <!-- КОМНАТА -->
    <div id="room" class="hidden">
        <header class="room-header">
            <button id="room-menu-btn" class="icon-btn" type="button">☰</button>
            <div class="room-heading">
                <div class="room-code-label">Код комнаты: <strong id="room-code-display">----</strong></div>
                <div class="role-indicator" id="role-label">Режим: Наблюдатель <span id="player-role">Вы —</span></div>
            </div>
            <button id="listeners-toggle-btn" class="icon-btn" type="button" title="Наблюдатели">♟</button>
        </header>

        <div class="game-status-panel">
            <div id="game-status-text">Статус: Ожидание игроков...</div>
            <div id="game-timer-text">--</div>
        </div>

        <div id="listeners-panel" class="hidden">
            <h4>Наблюдатели (<span id="listeners-count-label">0</span>)</h4>
            <div id="listeners-list-content"></div>
        </div>

        <main class="room-main-area">
            <div class="table-container" id="table-container"></div>
            <div id="voting-paper" class="voting-paper hidden">
                <div class="voting-title">Голосование</div>
                <div id="vote-results-list"></div>
                <div class="voting-hint">Нажмите на игрока, чтобы проголосовать</div>
            </div>
            <button id="ready-btn-game" onclick="toggleReady()">Готов к игре</button>
            <div class="controls">
                <button class="ctrl-btn" id="mic-btn" onclick="toggleMic()" disabled>🎤<span>Мик</span></button>
                <button class="ctrl-btn active" id="audio-btn" onclick="toggleAudio()">🔊<span>Звук</span></button>
                <button class="ctrl-btn" id="chat-toggle-btn" type="button">💬<span>Чат</span></button>
                <button id="role-card-btn" class="role-card" type="button"><span>РОЛЬ</span><strong id="role-card-value">Скрыто</strong></button>
            </div>
        </main>

        <div id="chat-container" class="chat-container hidden">
            <div class="chat-head">ЧАТ КОМНАТЫ <button id="chat-close-btn" type="button">×</button></div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area"><input type="text" id="chat-input" placeholder="Сообщение..." maxlength="150"><button type="button" id="chat-send-btn">➤</button></div>
        </div>
    </div>

    <div id="room-menu-modal" class="room-modal hidden">
        <div class="room-modal-card">
            <h2>Меню комнаты</h2>
            <button id="seat-action-btn" class="menu-action" type="button">🪑 Сесть за стол</button>
            <button id="menu-leave-btn" class="menu-action danger" type="button">🚪 Выйти из комнаты</button>
            <button id="menu-close-btn" class="menu-action secondary" type="button">Закрыть</button>
        </div>
    </div>

    <div id="role-modal" class="room-modal hidden">
        <div class="room-modal-card role-modal-card">
            <h2>Ваша роль</h2>
            <div id="role-modal-value" class="role-reveal">Роль ещё не назначена</div>
            <button id="role-close-btn" class="menu-action secondary" type="button">Закрыть</button>
        </div>
    </div>

    <script src="/js/livekit.js"></script>
    <script src="/js/socket.js"></script>
    <script src="/js/ui-helpers.js"></script>
    <script src="/js/roles.js"></script>
    <script src="/js/ui.js"></script>
</body>
</html>
